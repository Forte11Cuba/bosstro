arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
# Report keys present in the template (app_en.arb) but missing from any other
# locale. Regenerated by `flutter gen-l10n`; kept out of version control and
# checked in CI so a new key never lands untranslated. Currently empty.
untranslated-messages-file: lib/l10n/untranslated_messages.txt
# English first among the supported locales: Flutter falls back to the first
# one when the system's languages include none the app ships, and gen-l10n
# otherwise sorts them alphabetically (German first).
preferred-supported-locales: [en]
