name: bosstro
description: "Bosstro — the Mostro dispute solver's mobile app"
publish_to: 'none'

# Bump together with rust/Cargo.toml `version` (rust/src/api/mod.rs tests it).
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  # The Android build relies on the Flutter 3.47 Gradle plugin applying Kotlin itself
  # (android/app/build.gradle.kts has no kotlin-android plugin). An older SDK fails
  # here, at pub get, instead of deep inside Gradle.
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Bridge: Rust core ↔ Flutter UI. Same exact pin as MostroP2P/app and
  # rust/Cargo.toml (scripts/frb-generate.sh refuses to generate when they
  # disagree).
  flutter_rust_bridge: 2.11.1
  rust:
    path: rust_builder

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Internationalization
  intl: ^0.20.2

  # Injectable clock: the mascot's seasons read it, so tests can pin a date
  clock: ^1.1.1
  flutter_secure_storage: ^10.0.0
  mobile_scanner: ^7.2.0
  qr: ^3.0.2
  share_plus: ^12.0.1

  # About opens the source code in the browser (as MostroP2P/app).
  url_launcher: ^6.3.3

  # Where the database file lives (lib/core/services/app_storage.dart): the
  # app data directory, the XDG data dir on Linux. Same packages as
  # MostroP2P/app.
  path_provider: ^2.1.5
  path: ^1.9.1

  # Loading skeletons (DS-CMP-13), as MostroP2P/app.
  shimmer: ^3.0.0

  # Chat attachments, as MostroP2P/app: PDFs and the save dialog (file_picker;
  # SAF on Android), gallery and camera (image_picker), and the browser download
  # of a saved file on the web (web). file_picker is ahead of MostroP2P/app's
  # ^8.3.7: 8.x compiles against Android 34, and AGP 9 refuses it next to
  # flutter_plugin_android_lifecycle 2.0.35, which needs 36; 10.x compiles
  # against Flutter's own compileSdk.
  file_picker: ^10.3.7
  image_picker: ^1.2.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The UI against a local mostrod, by hand (integration_test/README.md).
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Generates the Android launcher icons from icons/bosstro-1024.png
  flutter_launcher_icons: ^0.14.2
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/mascot/
    - assets/fonts/outfit/OFL.txt
    - assets/fonts/manrope/OFL.txt
    - assets/fonts/noto_flags/LICENSE.txt

  # Brand typography, bundled so the app never fetches fonts at runtime (the
  # same assets as MostroP2P/app). Outfit is the UI face; Manrope sets the
  # figures (amounts, sats), whose tabular digits line up. Both are OFL-1.1: the
  # licences ship as assets and are registered with the LicenseRegistry at
  # startup (lib/core/font_licenses.dart).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Regular.ttf
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/outfit/Outfit-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
    # The flags of Noto Color Emoji (OFL), a fallback in both themes
    # (DS-TYP-8). Copied from MostroP2P/app, which builds it with
    # tool/flags_font/build_font.py.
    - family: NotoFlags
      fonts:
        - asset: assets/fonts/noto_flags/NotoFlags.ttf

# Launcher icon: a variant of MostroP2P/app's (D11, A8), so the two apps can be
# told apart when both are installed. icons/bosstro.png is the art; every other
# format in icons/ is built from it by:
#   python3 tool/launcher_icon/build_sources.py
# and the icons regenerated from it with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "icons/bosstro-1024.png"
  adaptive_icon_foreground: "icons/bosstro-1024.png"
  # Launchers mask the adaptive layer to about its central two thirds; this
  # inset keeps the gold ring inside the mask instead of clipping it.
  adaptive_icon_foreground_inset: 20
  # The emblem's own background, so the disc merges into the adaptive icon.
  adaptive_icon_background: "#111722"
