[package]
name = "rust"
version = "0.1.0"
license = "AGPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

# `frb_expand` is set by flutter_rust_bridge's macros during codegen expansion.
# Declare it so `cargo clippy -- -D warnings` does not flag it as an unknown cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dependencies]
# Same exact pin as pubspec.yaml and ../app (scripts/frb-generate.sh checks it).
flutter_rust_bridge = "=2.11.1"

# Nostr & Mostro protocol. Same versions as ../app, so transport v2, the chat
# envelope and attachments can be ported from it without a version gap.
nostr-sdk = { version = "0.45", default-features = false }
# nostr-sdk 0.45 no longer carries the NIP feature flags: they live on `nostr`
# itself and none are on by default (feature unification applies them to
# nostr-sdk's copy too).
nostr = { version = "0.45", default-features = false, features = ["std", "nip44"] }
mostro-core = "0.17.3"

# Error handling
anyhow = "1"

# Wipes the solver's secret as it arrives over the bridge, until it is parsed
# into `Keys` (whose `SecretKey` wipes itself on drop). Same crate as ../app.
zeroize = "1"

# Native only (Android, Linux): the Tokio runtime and SQLite do not compile to
# wasm32. The web build gets its own block below, as in ../app.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }

# Web only (scripts/build-web.sh). Same crates and reasons as ../app.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# tokio's sync primitives (the solver slot's locks) are runtime-agnostic and
# compile to wasm; nothing else of tokio does.
tokio = { version = "1", default-features = false, features = ["sync"] }
# Browser-backed clock for `universal-time` (rt.rs).
wasmtimer = "0.4"
# The getrandom versions under nostr, k256 and friends have no default backend on
# wasm32-unknown-unknown and must be told to use the browser's crypto.
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# nostr 0.45 reads the clock through universal-time, which on
# wasm32-unknown-unknown refuses to *link* until the final crate names a time
# provider (rt.rs). `cargo check` does not catch it; the web build does.
universal-time = { version = "0.3", default-features = false }
