description: |
  The mobile app for Mostro dispute solvers.

  When a trade on the Mostro peer-to-peer exchange goes wrong, a dispute solver steps in. Bosstro brings the admin side of Mostrix to the phone: see the disputes open on your node, take one, talk to the buyer and the seller, and settle it. Built with Flutter and a Rust core, like the Mostro app.

  Bosstro is for solvers: the operator of a Mostro node has to add your key as a dispute solver first. To buy or sell Bitcoin, use the Mostro app.

  Key Features:

    - Pending disputes: every open dispute on your node, live over Nostr
    - My disputes: take one and follow it until it closes
    - Private chat with the buyer and the seller, end-to-end encrypted (NIP-44), with images and PDFs
    - Read the trade chat between the parties when one of them shares its key with you
    - Resolve: pay the buyer or refund the seller (Read-Write solvers)
    - Choose your node: Mostro, a trusted community, or your own
    - Your solver key stays on your device, in Android Keystore-backed storage
    - Multi-Language: English, Spanish, Italian, French, German, Dutch, and Brazilian Portuguese
    - Open source: AGPLv3 licensed and fully auditable
summary: Take, chat and settle Mostro disputes from your phone.
